<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lex Politica — Template Studio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="assets/griffin-white.svg" alt="" class="brand-griffin">
      <span class="brand-name">Lex Politica — Template Studio</span>
    </div>
    <div class="export-buttons">
      <button id="export-jpeg" class="btn btn-ghost" type="button">Export JPEG</button>
      <button id="export-png" class="btn btn-solid" type="button">Export PNG</button>
    </div>
  </header>

  <main class="layout">
    <aside class="rail">
      <p class="panel-label">Choose a template</p>
      <div id="template-list" class="template-list"></div>
    </aside>

    <section class="stage">
      <div class="preview-wrap">
        <canvas id="preview"></canvas>
      </div>
    </section>

    <aside class="panel">
      <p class="panel-label">Edit this template</p>

      <div class="field">
        <span class="field-label">Format</span>
        <div id="format-picker" class="format-picker">
          <button class="format-option" data-format="square" type="button">
            <span class="format-name">Square</span>
            <span class="format-size">1080×1080</span>
          </button>
          <button class="format-option" data-format="threefour" type="button">
            <span class="format-name">3:4</span>
            <span class="format-size">1080×1440</span>
          </button>
          <button class="format-option" data-format="story" type="button">
            <span class="format-name">Story</span>
            <span class="format-size">1080×1920</span>
          </button>
        </div>
      </div>

      <div id="fields"></div>

      <div class="field" id="photo-field">
        <span class="field-label">Photo</span>
        <div id="dropzone" class="dropzone">
          <span id="dropzone-hint">Drop a photo or browse — converts to b&amp;w</span>
          <input type="file" id="photo-input" accept="image/*" hidden>
        </div>
        <button id="photo-clear" class="link-button" type="button" hidden>Remove photo</button>
      </div>

      <p class="locked-note">Layouts, type, and logos are locked to the Lex Politica brand. Only the fields above change.</p>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
